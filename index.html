<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const LB = 0.45359237;
const MUSCLES = [
  ["Pecho","🫁"],["Espalda","🔙"],["Dorsal","🪽"],["Hombros","🤷"],["Bíceps","💪"],["Tríceps","🦾"],
  ["Antebrazo","✊"],["Abdomen","🍫"],["Lumbar","🧱"],["Cuádriceps","🦵"],["Isquiotibiales","🦿"],
  ["Glúteos","🍑"],["Aductores","↔️"],["Abductores","↕️"],["Pantorrillas","🦶"],["Cardio","❤️"]
];
const MUSCLE_EMOJI = Object.fromEntries(MUSCLES);
const PAIRS = [["brazo","Brazo","💪","o"],["antebrazo","Antebrazo","✊","o"],["muslo","Muslo","🦵","o"],["pantorrilla","Pantorrilla","🦶","a"]];
const BODY = [
  {k:"pesoKg", l:"Peso", w:true, e:"⚖️", g:"base"},
  {k:"cuelloCm", l:"Cuello", u:"cm", e:"📏", g:"cinta"},
  {k:"hombrosCm", l:"Espalda (hombros)", u:"cm", e:"📏", g:"cinta"},
  {k:"pechoCm", l:"Pecho", u:"cm", e:"📏", g:"cinta"},
  {k:"espaldaAxilaCm", l:"Espalda (bajo brazos)", u:"cm", e:"📏", g:"cinta"},
  {k:"cinturaCm", l:"Cintura", u:"cm", e:"📏", g:"cinta"},
  {k:"caderaCm", l:"Cadera", u:"cm", e:"📏", g:"cinta"},
  ...PAIRS.flatMap(([k, l, e, o]) => [
    {k:k+"DerCm", l:l+" derech"+o, u:"cm", e, g:"par", pair:k, side:"d"},
    {k:k+"IzqCm", l:l+" izquierd"+o, u:"cm", e, g:"par", pair:k, side:"i"}
  ]),
  {k:"grasaPct", l:"Grasa corporal", u:"%", e:"🧈", g:"bio"},
  {k:"masaGrasaKg", l:"Masa grasa", w:true, e:"🫧", g:"bio"},
  {k:"masaMuscularKg", l:"Masa muscular esquelética", w:true, e:"💪", g:"bio"},
  {k:"aguaPct", l:"Agua corporal", u:"%", e:"💧", g:"bio"},
  {k:"grasaVisceral", l:"Grasa visceral", u:"nivel", e:"🎯", g:"bio"},
  {k:"tmbKcal", l:"Tasa metabólica basal", u:"kcal", e:"🔥", g:"bio"},
  {k:"edadMetabolica", l:"Edad metabólica", u:"años", e:"⏳", g:"bio"}
];
const DEFAULT_SETTINGS = {unidadOficial:"kg", tema:"sistema"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const pad = n => String(n).padStart(2,"0");
const dStr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dStr(new Date());
const pDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmtDate = (s, o) => { const t = pDate(s).toLocaleDateString("es", o || {weekday:"long", day:"numeric", month:"long"}); return t.charAt(0).toUpperCase() + t.slice(1); };
const fmtShort = s => pDate(s).toLocaleDateString("es", {day:"2-digit", month:"2-digit"});
const monday = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const U = () => S.settings.unidadOficial || "kg";
const toKg = (v,u) => v == null ? null : (u === "lb" ? v*LB : v);
const fromKg = (kg,u) => kg == null ? null : (u === "lb" ? kg/LB : kg);
const r1 = v => Math.round(v*10)/10;
function fmtW(kg, dec){ if (kg == null || kg === "") return "—"; const v = fromKg(Number(kg), U()); return (dec===0 ? Math.round(v) : r1(v)).toLocaleString("es") + " " + U(); }
const fmtN = v => v == null ? "—" : r1(v).toLocaleString("es");
const icon = n => `<i data-lucide="${n}"></i>`;
const exImgs = id => { const e = S.exercises[id]; return e && Array.isArray(e.imagenes) ? e.imagenes.filter(Boolean) : []; };
const thumb = (exId, emoji, cls) => { const im = exImgs(exId); return `<span class="tile ${cls||""}">${im.length ? `<img src="${esc(im[0])}" alt="" loading="lazy">` : esc(emoji||"🏋️")}</span>`; };
const videoLink = name => "https://www.youtube.com/results?search_query=" + encodeURIComponent(name + " técnica ejercicio");

/* ---------- estado ---------- */
const S = { settings:{...DEFAULT_SETTINGS}, media:{}, exercises:{}, routines:{}, sessions:{}, body:{}, notes:{}, draft:null, status:"loading", mode:"db",
  me:{id:null, owner:false} };
const UI = { tab:"rutina", view:"home", p:{}, rutinaSeg:"rutinas", sheet:null, toast:null, calMonth:null, calSel:today(),
  metric:"pesoKg", wunits:{}, pRange:"3m", pRoutine:"all", pEx:null, rForm:null, xForm:null, bForm:null, libQ:"" };
const HOST_THEME = document.documentElement.getAttribute("data-theme");
let assets = null;
let db = null, downloads = null, userApi = null, draftTimer = null, draftLoaded = false, seeding = false;

/* ---------- capa de datos ----------
   Uso individual. Lo personal va en data/users/<id>/gym/… (privado por plataforma).
   La biblioteca (exercises) y las ilustraciones (media/musculos) viven en la raíz.
   Si la biblioteca está vacía (copia nueva), se carga sola desde SEED_LIB, incrustada al final. */
const PRIV = ["routines","sessions","body","notes"];
const LKEY = "bitacora-gym-local-v1";
const BASE = () => S.mode === "db" && S.me.id ? `data/users/${S.me.id}/gym` : null;
const colPath = c => PRIV.includes(c) && BASE() ? `${BASE()}/${c}` : c;
const settingsDoc = () => BASE() ? `${BASE()}/config/settings` : "settings/main";
const draftDoc = () => BASE() ? `${BASE()}/config/draft` : "drafts/current";
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify({media:S.media, settings:S.settings, exercises:S.exercises, routines:S.routines, sessions:S.sessions, body:S.body, notes:S.notes, draft:S.draft})); }catch(e){} }
function loadLocal(){ try{ const o = JSON.parse(localStorage.getItem(LKEY) || "null"); if (o){ Object.assign(S, {media:o.media||{}, settings:{...DEFAULT_SETTINGS, ...o.settings}, exercises:o.exercises||{}, routines:o.routines||{}, sessions:o.sessions||{}, body:o.body||{}, notes:o.notes||{}, draft:o.draft||null}); } }catch(e){} }

const pending = new Set();
let loadTimer = null;
function arrived(k, meta){
  if (!meta || !meta.fromCache) pending.delete(k);
  if (!pending.size){ clearTimeout(loadTimer); S.status = "ready"; }
  render();
}
function onErr(e){ clearTimeout(loadTimer); S.status = "error"; S.err = e && (e.message || e.code); render(); }
const snapObj = snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = {...d.data(), id:d.id}; }); return o; };

async function initData(){
  render();
  loadTimer = setTimeout(() => { if (S.status === "loading"){ S.status = "slow"; render(); } }, 10000);
  const use = n => { try { return window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null); } catch(e){ return Promise.resolve(null); } };
  [db, downloads, assets, userApi] = await Promise.all([use("db"), use("downloads"), use("assets"), use("user")]);
  if (!db){ clearTimeout(loadTimer); S.mode = "local"; S.me = {id:null, owner:true}; loadLocal(); seedLocal(); S.status = "ready"; applyTheme(); render(); return; }
  S.me = { id: userApi ? await userApi.id() : null, owner: userApi ? !!(await userApi.isOwner()) : true };
  pending.add("exercises");
  db.collection("exercises").onSnapshot(snap => {
    S.exercises = snapObj(snap); arrived("exercises", snap.metadata);
    if (!snap.metadata.fromCache && !snap.docs.length) seedDb();
  }, onErr);
  db.doc("media/musculos").onSnapshot(s => { S.media = s.exists ? s.data() : {}; render(); }, () => {});
  subscribePersonal();
}
/* biblioteca inicial: solo se escribe cuando la colección está vacía */
function seedData(){ try { return JSON.parse(document.getElementById("seed-lib").textContent); } catch(e){ return null; } }
function seedLocal(){
  if (Object.keys(S.exercises).length) return;
  const sd = seedData(); if (!sd) return;
  Object.entries(sd.exercises || {}).forEach(([id, x]) => { S.exercises[id] = {...x, id}; });
  if (!Object.keys(S.media).length) S.media = sd.media || {};
  saveLocal();
}
async function seedDb(){
  if (seeding || !S.me.owner) return;
  const sd = seedData(); if (!sd) return;
  seeding = true; toast("Cargando la biblioteca de ejercicios…");
  try {
    if (sd.media) await db.doc("media/musculos").set(sd.media);
    for (const [id, x] of Object.entries(sd.exercises || {})) await db.collection("exercises").doc(id).set(x);
    toast("Biblioteca lista: " + Object.keys(sd.exercises || {}).length + " ejercicios");
  } catch(e){ toast("No se pudo cargar la biblioteca: " + (e.message || e.code)); seeding = false; }
}
function subscribePersonal(){
  S.status = "loading";
  PRIV.forEach(c => { pending.add(c); db.collection(colPath(c)).onSnapshot(snap => {
    S[c] = snapObj(snap); arrived(c, snap.metadata);
  }, onErr); });
  pending.add("settings"); pending.add("drafts");
  db.doc(settingsDoc()).onSnapshot(s => { S.settings = {...DEFAULT_SETTINGS, ...(s.exists ? s.data() : {})}; applyTheme(); arrived("settings", s.metadata); }, onErr);
  db.doc(draftDoc()).onSnapshot(s => {
    if (!draftLoaded || (!S.draft && !draftTimer)) { S.draft = s.exists && s.data().items ? clone(s.data()) : null; }
    if (!s.metadata.fromCache) draftLoaded = true;
    arrived("drafts", s.metadata);
  }, onErr);
}
async function put(col, id, data){
  S[col][id] = {...data, id};
  if (S.mode === "local"){ saveLocal(); render(); return true; }
  render();
  try { const body = {...data}; delete body.id; await db.collection(colPath(col)).doc(id).set(body); return true; }
  catch(e){ toast("No se pudo guardar: " + (e.message || e.code)); return false; }
}
async function del(col, id){
  delete S[col][id];
  if (S.mode === "local"){ saveLocal(); render(); return; }
  render();
  try { await db.collection(colPath(col)).doc(id).delete(); } catch(e){ toast("No se pudo borrar: " + (e.message || e.code)); }
}
async function putSettings(patch){
  S.settings = {...S.settings, ...patch}; applyTheme();
  if (S.mode === "local"){ saveLocal(); render(); return; }
  render();
  try { await db.doc(settingsDoc()).set({...S.settings}); } catch(e){ toast("No se pudo guardar: " + (e.message || e.code)); }
}
function saveDraftSoon(){
  if (S.mode === "local"){ saveLocal(); return; }
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async () => {
    draftTimer = null;
    try { if (S.draft) await db.doc(draftDoc()).set(clone(S.draft)); else await db.doc(draftDoc()).delete(); }
    catch(e){ toast("No se pudo guardar la sesión en curso"); }
  }, 500);
}
const canEditEx = x => S.mode === "local" || S.me.owner || !S.exercises[x.id] || S.exercises[x.id].creadoPor === S.me.id;
function applyTheme(){
  const t = S.settings.tema, root = document.documentElement;
  if (t === "claro") root.setAttribute("data-theme","light");
  else if (t === "oscuro") root.setAttribute("data-theme","dark");
  else if (HOST_THEME) root.setAttribute("data-theme", HOST_THEME);
  else root.removeAttribute("data-theme");
}

/* ---------- consultas derivadas ---------- */
const exName = id => (S.exercises[id] && S.exercises[id].nombre) || "Ejercicio eliminado";
const activeRoutines = () => Object.values(S.routines).filter(r => !r.archivada).sort((a,b) => (a.orden??0)-(b.orden??0) || a.nombre.localeCompare(b.nombre));
const sessionsSorted = () => Object.values(S.sessions).sort((a,b) => a.fecha === b.fecha ? (a.creado||0)-(b.creado||0) : a.fecha < b.fecha ? -1 : 1);
const DAY_NAMES = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DAY_SHORT = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
function suggestion(){
  const rs = activeRoutines(); if (!rs.length) return null;
  const sched = rs.filter(r => (r.dias||[]).length);
  if (sched.length){
    const now = new Date(), td = today();
    const doneToday = new Set(Object.values(S.sessions).filter(s => s.fecha === td).map(s => s.routineId));
    for (let k = 0; k < 7; k++){ const d = (now.getDay()+k) % 7; const r = sched.find(x => x.dias.includes(d) && !(k === 0 && doneToday.has(x.id))); if (r) return {r, label: k === 0 ? "Hoy" : k === 1 ? "Mañana" : "El " + DAY_NAMES[d]}; }
  }
  const r = nextRoutine(); return r ? {r, label:"Siguiente"} : null;
}
function nextRoutine(){
  const rs = activeRoutines(); if (!rs.length) return null;
  const ss = sessionsSorted().filter(s => S.routines[s.routineId] && !S.routines[s.routineId].archivada);
  if (!ss.length) return rs[0];
  const i = rs.findIndex(r => r.id === ss[ss.length-1].routineId);
  return rs[(i+1) % rs.length];
}
function lastLoad(exId){
  const ss = sessionsSorted();
  for (let i = ss.length-1; i >= 0; i--){ const it = (ss[i].items||[]).find(x => x.exerciseId === exId && x.completado && x.cargaKg > 0); if (it) return it.cargaKg; }
  return null;
}
function loadHistory(exId){
  const pts = [];
  sessionsSorted().forEach(s => { const its = (s.items||[]).filter(x => x.exerciseId === exId && x.completado && x.cargaKg > 0); if (its.length) pts.push({x:s.fecha, y:Math.max(...its.map(x => x.cargaKg))}); });
  return pts;
}
const datesWithSessions = () => { const m = {}; Object.values(S.sessions).forEach(s => { (m[s.fecha] = m[s.fecha] || []).push(s); }); return m; };
function streak(){ return streakOf(Object.values(S.sessions).map(s => s.fecha)); }
function streakOf(dates){
  const weeks = new Set(dates.filter(Boolean).map(d => dStr(monday(pDate(d)))));
  let w = monday(new Date()); if (!weeks.has(dStr(w))) w.setDate(w.getDate()-7);
  let n = 0; while (weeks.has(dStr(w))){ n++; w.setDate(w.getDate()-7); }
  return n;
}
function calcTotals(items){
  let vol = 0, reps = 0, done = 0;
  items.forEach(it => { if (!it.completado) return; done++; if (it.tipo === "cardio") return; const sr = (it.series||0)*(it.reps||0); reps += sr; vol += sr*(it.cargaKg||0); });
  return {volumenKg: Math.round(vol*10)/10, repsTotal: reps, hechos: done};
}

const top = (title, back, right) => `<div class="top">${back ? `<button class="backbtn" data-act="${back}">${icon("arrow-left")}<span>Volver</span></button>` : ""}<div class="title">${title}</div>${right||""}</div>`;
function wInput(id, bind, kg){
  const u = UI.wunits[id] || U(); const v = kg == null ? "" : r1(fromKg(kg, u));
  return `<div class="winput"><input class="input num" id="${id}" type="number" inputmode="decimal" step="0.5" min="0" data-w="${bind}" data-wid="${id}" value="${v}" placeholder="0"><button type="button" data-act="wunit" data-id="${id}" aria-label="Cambiar unidad">${u}</button></div>`;
}
const stepper = (bind, v) => `<div class="stepper"><button data-act="step" data-f="${bind}" data-d="-1" aria-label="Menos">${icon("minus")}</button><span class="v">${v ?? 0}</span><button data-act="step" data-f="${bind}" data-d="1" aria-label="Más">${icon("plus")}</button></div>`;
const seg = (act, opts, cur) => `<div class="seg" role="group">${opts.map(([v,l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join("")}</div>`;
function chart(pts, fmt){
  if (!pts.length) return `<p class="muted small">Todavía no hay registros.</p>`;
  const W = 320, H = 150, L = 10, R = 10, T = 26, B = 24;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys); if (mn === mx){ mn -= 1; mx += 1; }
  const X = i => pts.length === 1 ? W/2 : L + i*(W-L-R)/(pts.length-1);
  const Y = v => T + (1-(v-mn)/(mx-mn))*(H-T-B);
  const line = pts.map((p,i) => `${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const area = pts.length > 1 ? `<path class="area" d="${line} L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z"/>` : "";
  const show = i => pts.length <= 6 || i === 0 || i === pts.length-1 || pts[i].y === Math.max(...ys);
  const anchor = i => pts.length === 1 ? "middle" : i === 0 ? "start" : i === pts.length-1 ? "end" : "middle";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolución">
    <line class="grid" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    ${area}${pts.length > 1 ? `<path class="ln" d="${line}"/>` : ""}
    ${pts.map((p,i) => `<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4"/>${show(i) ? `<text class="lbl" x="${X(i).toFixed(1)}" y="${(Y(p.y)-9).toFixed(1)}" text-anchor="${anchor(i)}">${esc(fmt(p.y))}</text>` : ""}`).join("")}
    ${pts.map((p,i) => (pts.length <= 6 || i === 0 || i === pts.length-1) ? `<text class="ax" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${anchor(i)}">${fmtShort(p.x)}</text>` : "").join("")}
  </svg>`;
}
const routineMeta = r => { const n = (r.items||[]).length; const ds = (r.dias||[]).slice().sort((a,b) => ((a+6)%7)-((b+6)%7)).map(d => DAY_SHORT[d]).join(", "); return `${n} ejercicio${n===1?"":"s"}${ds ? " · " + ds : ""}`; };
function itemMeta(it){
  if (it.tipo === "cardio") return `${it.minutos||0} min`;
  const reps = it.repMin && it.repMax && it.repMin !== it.repMax ? `${it.repMin}–${it.repMax}` : (it.reps || it.repMin || 0);
  return `${it.series||0} × ${reps}${it.cargaKg ? " · " + fmtW(it.cargaKg) : ""}`;
}

/* ---------- salud: perfil, medidas y cálculos ---------- */
function perfil(){ return S.settings.perfil || {}; }
function edad(nac){ if (!nac) return null; const b = pDate(nac), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--; return a; }
function derive(r){
  const p = perfil(), h = num(p.alturaCm), o = {};
  if (h && r.pesoKg) o.imc = r.pesoKg / Math.pow(h/100, 2);
  if (h && r.cinturaCm) o.ica = r.cinturaCm / h;
  if (h && r.cuelloCm && r.cinturaCm){
    if (p.sexo === "h" && r.cinturaCm > r.cuelloCm) o.grasaEst = 495 / (1.0324 - 0.19077*Math.log10(r.cinturaCm - r.cuelloCm) + 0.15456*Math.log10(h)) - 450;
    if (p.sexo === "m" && r.caderaCm && r.cinturaCm + r.caderaCm > r.cuelloCm) o.grasaEst = 495 / (1.29579 - 0.35004*Math.log10(r.cinturaCm + r.caderaCm - r.cuelloCm) + 0.22100*Math.log10(h)) - 450;
    if (o.grasaEst != null && (o.grasaEst < 2 || o.grasaEst > 70)) delete o.grasaEst;
  }
  const a = edad(p.nacimiento);
  if (h && r.pesoKg && a != null && p.sexo) o.tmbEst = 10*r.pesoKg + 6.25*h - 5*a + (p.sexo === "h" ? 5 : -161);
  return o;
}
const DERIVED = [
  {k:"imc", l:"IMC", u:"", e:"🧮", d:true},
  {k:"grasaEst", l:"Grasa estimada", u:"%", e:"📐", d:true},
  {k:"ica", l:"Cintura / altura", u:"", e:"📏", d:true, dec:2},
  {k:"tmbEst", l:"Metabolismo basal estimado", u:"kcal", e:"🔥", d:true}
];
const ALL_METRICS = [...BODY, ...DERIVED];
const mval = (r, f) => f.d ? derive(r)[f.k] : r[f.k];
const fmtM = (f, v) => v == null ? "—" : f.w ? fmtW(v) : (f.dec ? (Math.round(v*100)/100).toLocaleString("es") : fmtN(f.u === "kcal" ? Math.round(v) : v)) + (f.u ? " " + f.u : "");
function imcCat(v){ return v < 18.5 ? "Bajo peso" : v < 25 ? "Normal" : v < 30 ? "Sobrepeso" : "Obesidad"; }
function icaCat(v){ return v < 0.5 ? "Saludable" : v < 0.6 ? "Riesgo aumentado" : "Riesgo alto"; }

function vSalud(){

/* ---------- progreso (dashboards) ---------- */
const RANGES = [["4s","4 semanas",28],["3m","3 meses",91],["6m","6 meses",182],["1a","12 meses",365],["todo","Todo",null]];
function bars(data, fmt, aria){
  if (!data.some(d => d.y)) return `<p class="muted small" style="margin:0">Sin datos en este periodo.</p>`;
  const W = 320, H = 150, L = 2, R = 2, T = 20, B = 22, n = data.length, slot = (W-L-R)/n;
  const bw = Math.max(2, Math.min(26, slot - 2)), mx = Math.max(...data.map(d => d.y || 0)) || 1;
  const Y = v => T + (1 - v/mx) * (H-T-B), base = H - B, every = Math.ceil(n/6);
  const barPath = (x, y) => { const r = Math.min(4, bw/2, base - y); return `M${x},${base} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${base} Z`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    <line class="grid" x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke-dasharray="2 3"/><text class="ax" x="${L}" y="${T-6}">${esc(fmt(mx))}</text>
    <line class="grid" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>
    ${data.map((d,i) => { const x = L + i*slot + (slot-bw)/2; return `${d.y ? `<path class="bar" d="${barPath(x, Y(d.y))}"/>` : ""}<rect class="hit" x="${(L+i*slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${H-T}" data-tip="${esc(d.tip)}" tabindex="0"/>${i % every === 0 ? `<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(d.x)}</text>` : ""}`; }).join("")}
  </svg>`;
}
function hbars(rows, fmt){
  if (!rows.length) return `<p class="muted small" style="margin:0">Sin datos en este periodo.</p>`;
  const mx = Math.max(...rows.map(r => r.v)) || 1;
  return `<div class="hb">${rows.map(r => `<div class="hb-row" data-tip="${esc(r.tip || (r.l + ": " + fmt(r.v)))}" tabindex="0"><span class="hb-l">${esc(r.l)}</span><span class="hb-track"><span class="hb-bar" style="width:${Math.max(2, r.v/mx*100).toFixed(1)}%"></span></span><span class="hb-v num">${esc(fmt(r.v))}</span></div>`).join("")}</div>`;
}
function dataTable(head, rows){
  return `<details class="tbl"><summary class="link">Ver datos</summary><div class="tw"><table><thead><tr>${head.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
}
function vProgreso(){

  if (!ss.length && !plannedT) return h + `<div class="card empty"><span class="big">📊</span><h2>Aún no hay datos en este periodo</h2><p class="muted small" style="margin:0">Cuando registres entrenamientos verás aquí tu cumplimiento, calorías y progreso por ejercicio.</p></div>`;
  h += `<div class="grid2">

    <div class="stat"><span class="l">Sesiones</span><span class="v">${ss.length}</span><span class="l">${(ss.length / Math.max(1, wk.length)).toLocaleString("es",{maximumFractionDigits:1})} por semana</span></div>

/* ---------- hojas ---------- */
function vSheet(){
  const s = UI.sheet; if (!s) return "";
  let body = "";
  if (s.type === "confirm") body = `<h2>${s.title}</h2>${s.text ? `<p class="muted small" style="margin:0">${s.text}</p>` : ""}<button class="btn ${s.danger?"danger":""}" data-act="${s.ok}" ${s.id?`data-id="${s.id}"`:""}>${s.okLabel}</button><button class="btn ghost" data-act="closeSheet">Cancelar</button>`;
  if (s.type === "finish"){
    const pend = S.draft.items.filter(i => !i.completado).length;
    body = `<h2>Terminar entrenamiento</h2>${pend ? `<div class="banner">${icon("info")}<span>Tienes ${pend} ejercicio${pend===1?"":"s"} sin marcar. Se guardarán como no realizados.</span></div>` : ""}
      <label class="field">🔥 Calorías quemadas en la sesión<input class="input num" id="fin-cal" type="number" inputmode="numeric" min="0" placeholder="kcal" value="${s.cal ?? ""}"></label>
      ${s.err ? `<span class="small" style="color:var(--danger)">${s.err}</span>` : ""}
      <button class="btn save" data-act="finish">${icon("check")} Guardar entrenamiento</button><button class="btn ghost" data-act="closeSheet">Seguir entrenando</button>`;
  }
  if (s.type === "swap"){
    const it = S.draft.items[s.i], ex = S.exercises[s.id];
    body = `<h2>Cambiar ejercicio</h2><div class="row"><span class="tile sm">${esc(it.emoji||"🏋️")}</span><span class="grow small">${esc(it.nombre)}</span>${icon("arrow-right")}<span class="tile sm">${esc(ex.emoji||"🏋️")}</span><span class="grow small" style="font-weight:600">${esc(ex.nombre)}</span></div>
      <button class="toggle" data-act="swapPerm" ${S.routines[S.draft.routineId] ? "" : "disabled"}><span><div style="font-weight:600">Guardar en la rutina de aquí en adelante</div><div class="muted small">${S.routines[S.draft.routineId] ? "Si está apagado, el cambio aplica solo a esta sesión." : "La rutina original ya no existe."}</div></span><span class="sw ${s.perm?"on":""}"></span></button>
      <button class="btn" data-act="swapDo">Confirmar cambio</button><button class="btn ghost" data-act="closeSheet">Cancelar</button>`;
  }
  if (s.type === "pick"){
    const rs = activeRoutines();
    body = `<h2>${s.title}</h2>${S.draft ? `<div class="banner">${icon("info")}<span>Esto reemplaza la sesión en curso de ${esc(S.draft.rutinaNombre)}.</span></div>` : ""}<div class="list">${rs.map(r => `<button class="item" data-act="pickRoutine" data-id="${r.id}"><span class="tile sm">${esc(r.emoji||"🏋️")}</span><span class="grow"><span class="row" style="gap:8px"><span class="letter">${esc(r.letra||"·")}</span><span class="name">${esc(r.nombre)}</span></span></span></button>`).join("") || `<p class="muted small">No tienes rutinas activas.</p>`}</div><button class="btn ghost" data-act="closeSheet">Cancelar</button>`;
  }
  if (s.type === "export") body = `<h2>Exportar datos</h2><p class="muted small" style="margin:0">La descarga directa no está disponible aquí. Copia este texto y guárdalo como archivo .json.</p><textarea class="input" id="exp-txt" style="min-height:200px;font-size:12px" readonly>${esc(s.json)}</textarea><button class="btn" data-act="copyExport">Copiar</button><button class="btn ghost" data-act="closeSheet">Cerrar</button>`;
  return `<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="panel">${body}</div></div>`;
}

/* ---------- render ---------- */
let lastKey = "";
function render(scrollTop){
  const app = document.getElementById("app"), ov = document.getElementById("overlay");
  const ae = document.activeElement, fid = ae && ae.id, sel = fid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
  let h = "";
  if (S.status === "slow") h += `<div class="banner">${icon("wifi-off")}<span>Aún no se pudo conectar con la base de datos. Lo que ves puede no estar al día.</span></div>`;
  if (S.status === "error") h += `<div class="banner">${icon("alert-triangle")}<span>No se pudieron leer los datos (${esc(S.err||"")}). Recarga la página más tarde.</span></div>`;
  const v = UI.view;
  if (UI.tab === "rutina") h += v === "session" ? vSession() : v === "item" ? vItem() : v === "summary" ? vSummary() : v === "sessionDetail" ? vSessionDetail() : vRutinaHome();
  else if (UI.tab === "progreso") h += vProgreso();
  else if (UI.tab === "salud") h += v === "bodyForm" ? vBodyForm() : vSalud();
  else h += v === "routines" ? vRoutines() : v === "routineEdit" ? vRoutineEdit() : v === "library" ? vLibrary() : v === "exerciseEdit" ? vExerciseEdit() : vConfig();
  const fullScreen = ["session","item","summary","sessionDetail","bodyForm","routineEdit","exerciseEdit"].includes(v);
  const tabs = [["rutina","dumbbell","Rutina"],["progreso","chart-column","Progreso"],["salud","heart-pulse","Salud"]].concat([["config","settings","Configuración"]]);
  if (!fullScreen) h += `<nav class="tabs" aria-label="Módulos"><div class="in">${tabs.map(([t,i,l]) => `<button data-act="tab" data-t="${t}" ${UI.tab===t?'aria-current="page"':""}>${icon(i)}${l}</button>`).join("")}</div></nav>`;
  app.className = "app" + (v === "session" ? " has-bar" : "");
  app.innerHTML = h;
  ov.innerHTML = vSheet() + (UI.toast ? `<div class="toast" role="status">${esc(UI.toast)}</div>` : "");
  if (window.lucide) window.lucide.createIcons();
  const key = UI.tab + "/" + v + "/" + JSON.stringify(UI.p);
  if (scrollTop === true || key !== lastKey) window.scrollTo(0,0);
  lastKey = key;
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({preventScroll:true}); if (sel) try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
}

/* ---------- edición genérica ---------- */
function setPath(path, value){
  const parts = path.split("."), rootK = parts.shift();
  let o = rootK === "draft" ? S.draft : UI[rootK];
  if (!o) return;
  for (let i = 0; i < parts.length-1; i++) o = o[parts[i]];
  o[parts[parts.length-1]] = value;
  if (rootK === "draft") saveDraftSoon();
}
function getPath(path){ const parts = path.split("."), rootK = parts.shift(); let o = rootK === "draft" ? S.draft : UI[rootK]; for (const p of parts) o = o == null ? o : o[p]; return o; }

function bindValue(t){
  if (t.dataset.w){ const u = UI.wunits[t.dataset.wid] || U(); setPath(t.dataset.w, toKg(num(t.value), u)); return true; }
  if (t.dataset.f){ setPath(t.dataset.f, t.dataset.num ? num(t.value) : t.value); return true; }
  return false;
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "importFile") return importFile(t.files[0]);
  if (t.dataset.perfil){ const k = t.dataset.perfil; putSettings({perfil:{...perfil(), [k]: k === "alturaCm" ? num(t.value) : t.value}}); return; }
  if (t.dataset.ui){ UI[t.dataset.ui] = t.value; render(); return; }
  if (t.id === "x-upload") return uploadExImages([...t.files].slice(0,2));
  if (t.tagName !== "SELECT" && t.type !== "date") return;
  if (t.dataset.pick != null && t.value === "__new"){ const i = Number(t.dataset.pick); UI.xForm = {id:uid(), nombre:"", emoji:"🏋️", tipo:"fuerza", musculos:[], alternativas:[], nota:"", _assign:i, _from:"routineEdit"}; UI.view = "exerciseEdit"; render(true); return; }
  if (bindValue(t)) render();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.live === "libQ"){ UI.libQ = t.value; render(); return; }
  if (t.tagName !== "SELECT" && t.type !== "date") bindValue(t);
  if (t.id === "note-ex"){ UI.noteDraft = {id:t.dataset.id, v:t.value}; const c = document.getElementById("note-count"); if (c) c.textContent = t.value.length + "/300"; }
  if (t.id === "fin-cal" && UI.sheet) UI.sheet.cal = t.value;
});

/* ---------- acciones ---------- */
function startDraft(r, fecha){
  S.draft = { routineId:r.id, rutinaNombre:r.nombre, rutinaLetra:r.letra||"", rutinaEmoji:r.emoji||"🏋️", fecha: fecha || today(), iniciada: Date.now(),
    items: (r.items||[]).map((it, rIdx) => [it, rIdx]).filter(([it]) => it.exerciseId).map(([it, rIdx]) => { const ex = S.exercises[it.exerciseId] || {};
      return { key:uid(), rIdx, exerciseId:it.exerciseId, nombre:ex.nombre || "Ejercicio", emoji:ex.emoji || "🏋️", tipo:ex.tipo || "fuerza",
        series:it.series ?? 3, repMin:it.repMin ?? null, repMax:it.repMax ?? null, reps:it.repMin ?? it.repMax ?? 10,
        cargaKg: lastLoad(it.exerciseId) ?? it.cargaKg ?? null, minutos:it.minutos ?? null, completado:false }; }) };
  saveDraftSoon(); go("session", {}, "rutina");
}
async function finish(){
  const raw = document.getElementById("fin-cal"), cal = num(raw ? raw.value : UI.sheet.cal);
  if (cal == null || cal < 0){ UI.sheet.err = "Escribe las calorías de la sesión (puede ser 0)."; render(); return; }
  const d = S.draft, t = calcTotals(d.items), id = uid();
  const session = { fecha:d.fecha, creado:Date.now(), routineId:d.routineId, rutinaNombre:d.rutinaNombre, rutinaLetra:d.rutinaLetra, rutinaEmoji:d.rutinaEmoji,
    items: d.items.map(({key, rIdx, ...x}) => x), calorias: Math.round(cal), volumenKg:t.volumenKg, repsTotal:t.repsTotal, hechos:t.hechos };
  UI.sheet = null;
  const ok = await put("sessions", id, session);
  if (!ok) return;
  S.draft = null; clearTimeout(draftTimer); draftTimer = null;
  if (S.mode === "local") saveLocal(); else { try{ await db.doc(draftDoc()).delete(); }catch(e){} }
  UI.calSel = session.fecha;
  go("summary", {id}, "rutina");
}
async function doSwap(){
  const s = UI.sheet, it = S.draft.items[s.i], ex = S.exercises[s.id];
  const original = it.intercambiadoDe || it.nombre;
  Object.assign(it, { exerciseId:ex.id, nombre:ex.nombre, emoji:ex.emoji||"🏋️", tipo:ex.tipo||"fuerza", cargaKg: lastLoad(ex.id) ?? null, intercambiadoDe: original });
  saveDraftSoon();
  if (s.perm){
    const r = S.routines[S.draft.routineId];
    if (r){ const rr = clone(r); delete rr.id; const idx = it.rIdx != null && rr.items[it.rIdx] ? it.rIdx : rr.items.findIndex(x => x.exerciseId === s.from); if (idx >= 0){ rr.items[idx].exerciseId = ex.id; rr.items[idx].cargaKg = null; } rr.actualizada = Date.now(); await put("routines", r.id, rr); }
    toast("Cambio guardado también en la rutina");
  } else toast("Cambio aplicado solo a esta sesión");
  UI.sheet = null; go("item", {i:s.i});
}
function saveRoutine(){
  const r = UI.rForm;
  if (!r.nombre || !r.nombre.trim()){ toast("Ponle un nombre a la rutina"); return; }
  const items = r.items.filter(it => it.exerciseId && S.exercises[it.exerciseId]);
  if (!items.length){ toast("Agrega al menos un ejercicio"); return; }
  const existing = S.routines[r.id];
  const orden = existing ? existing.orden : (Math.max(-1, ...Object.values(S.routines).map(x => x.orden ?? 0)) + 1);
  put("routines", r.id, { nombre:r.nombre.trim(), letra:(r.letra||"").trim().toUpperCase(), emoji:r.emoji||"🏋️", items: items.map(it => ({exerciseId:it.exerciseId, series:it.series ?? null, repMin:it.repMin ?? null, repMax:it.repMax ?? null, cargaKg:it.cargaKg ?? null, minutos:it.minutos ?? null})),
    dias: (r.dias||[]).slice().sort(), archivada: existing ? !!existing.archivada : false, orden, actualizada: Date.now() });
  toast("Rutina guardada"); go("routines");
}
function saveExercise(){
  const x = UI.xForm;
  if (!x.nombre || !x.nombre.trim()){ toast("Ponle un nombre al ejercicio"); return; }
  if (!canEditEx(x)){ toast("Solo puedes editar los ejercicios que creaste"); return; }
  const prev = S.exercises[x.id];
  put("exercises", x.id, { nombre:x.nombre.trim(), emoji:x.emoji||"🏋️", tipo:x.tipo, musculos:x.musculos, alternativas:x.alternativas.filter(a => S.exercises[a]), nota:x.nota||"", imagenes:(x.imagenes||[]).slice(0,2), fuenteImg:x.fuenteImg||"", creadoPor: prev ? (prev.creadoPor || null) : (S.me.id || null) });
  // alternativas recíprocas (solo en ejercicios que esta persona puede editar)
  x.alternativas.forEach(a => { const o = S.exercises[a]; if (o && canEditEx(o) && !(o.alternativas||[]).includes(x.id)){ const oo = clone(o); delete oo.id; oo.alternativas = [...(oo.alternativas||[]), x.id]; put("exercises", a, oo); } });
  toast("Ejercicio guardado");
  if (x._from === "routineEdit" && UI.rForm){ const it = UI.rForm.items[x._assign]; if (it){ it.exerciseId = x.id; if (x.tipo === "cardio"){ it.minutos = it.minutos ?? 15; } } UI.xForm = null; go("routineEdit", {}, "config"); }
  else { UI.xForm = null; go("library"); }
}
async function uploadExImages(files){
  if (!assets || !files.length || !UI.xForm) return;
  toast("Subiendo imagen…");
  try {
    const urls = [];
    for (const f of files){ const r = await assets.upload(f); urls.push(r.url); }
    UI.xForm.imagenes = urls; UI.xForm.fuenteImg = "Subida por ti"; render(); toast("Imagen lista: guarda el ejercicio");
  } catch(e){ toast("No se pudo subir: " + (e.message || e.code)); }
}
function exportData(){
  const data = { app:"bitacora-gym", version:2, exportado:new Date().toISOString(), settings:S.settings, routines:S.routines, sessions:S.sessions, body:S.body, notes:S.notes };
  if (S.mode === "local" || S.me.owner) data.exercises = S.exercises;
  const json = JSON.stringify(data, null, 2);
  if (downloads){ downloads.save({filename:`bitacora-gym-${today()}.json`, data:json}).then(() => toast("Archivo exportado")).catch(e => { if (e && e.code !== "declined") openSheet({type:"export", json}); }); }
  else openSheet({type:"export", json});
}
const importCols = () => (S.mode === "local" || S.me.owner ? ["exercises"] : []).concat(["routines","sessions","body","notes"]);
function importFile(file){
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try {
    const o = JSON.parse(rd.result); if (!o || o.app !== "bitacora-gym") throw new Error("formato");
    const n = importCols().reduce((a,c) => a + Object.keys(o[c]||{}).length, 0);
    UI.pendingImport = o;
    openSheet({type:"confirm", title:"Importar respaldo", text:`Se agregarán o actualizarán ${n} registros (los que tengan el mismo identificador se reemplazan). No se borra nada.`, ok:"doImport", okLabel:"Importar"});
  } catch(e){ toast("Ese archivo no es un respaldo válido de esta bitácora"); } };
  rd.readAsText(file);
}
async function doImport(){
  const o = UI.pendingImport; UI.pendingImport = null; closeSheet(); if (!o) return;
  if (o.settings) await putSettings({unidadOficial:o.settings.unidadOficial||"kg", tema:o.settings.tema||"sistema"});
  for (const c of importCols()) for (const [id, v] of Object.entries(o[c]||{})){ const b = {...v}; delete b.id; await put(c, id, b); }
  toast("Respaldo importado");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act, ds = el.dataset;
  switch (a){
    case "tab": UI.tab = ds.t; UI.view = "home"; UI.p = {}; render(true); break;
    case "rseg": UI.rutinaSeg = ds.v; render(); break;
    case "goHome": UI.rutinaSeg = "rutinas"; go("home", {}, "rutina"); break;
    case "goHistorial": UI.rutinaSeg = "historial"; go("home", {}, "rutina"); break;
    case "goSalud": UI.bForm = null; go("home", {}, "salud"); break;
    case "goConfig": go("home", {}, "config"); break;
    case "goRoutines": UI.rForm = null; go("routines", {}, "config"); break;
    case "goLibrary": go("library", {}, "config"); break;
    case "closeSheet": closeSheet(); break;
    case "wunit": { const cur = UI.wunits[ds.id] || U(); UI.wunits[ds.id] = cur === "kg" ? "lb" : "kg"; render(); break; }
    case "step": { const cur = Number(getPath(ds.f)) || 0; setPath(ds.f, Math.max(0, cur + Number(ds.d))); render(); break; }
    /* rutina */
    case "openDraft": go("session", {}, "rutina"); break;
    case "startRoutine": { const r = S.routines[ds.id]; if (S.draft){ if (S.draft.routineId === r.id && S.draft.fecha === today()) return go("session"); openSheet({type:"confirm", title:"Ya tienes una sesión en curso", text:`Empezar ${esc(r.nombre)} descarta la sesión de ${esc(S.draft.rutinaNombre)} sin guardarla.`, ok:"startForce", id:r.id, okLabel:"Empezar nueva sesión", danger:true}); } else startDraft(r); break; }
    case "startForce": startDraft(S.routines[ds.id]); break;
    case "newRoutine": UI.rForm = {id:uid(), nombre:"", letra:String.fromCharCode(65 + activeRoutines().length % 26), emoji:"🏋️", items:[{exerciseId:"", series:3, repMin:12, repMax:15, cargaKg:null}]}; go("routineEdit", {}, "config"); break;
    case "toggleItem": { const it = S.draft.items[ds.i]; it.completado = !it.completado; saveDraftSoon(); render(); break; }
    case "openItem": go("item", {i:Number(ds.i)}); break;
    case "backSession": go("session"); break;
    case "discardAsk": openSheet({type:"confirm", title:"Descartar sesión", text:"Se pierde lo marcado en esta sesión. No se guarda en el historial.", ok:"discard", okLabel:"Descartar", danger:true}); break;
    case "discard": S.draft = null; saveDraftSoon(); go("home", {}, "rutina"); break;
    case "finishAsk": openSheet({type:"finish"}); setTimeout(() => { const c = document.getElementById("fin-cal"); if (c) c.focus(); }, 30); break;
    case "finish": finish(); break;
    case "saveNote": { if (!S.exercises[ds.id]) break; put("notes", ds.id, {texto: document.getElementById("note-ex").value.slice(0,300), act: Date.now()}); UI.noteDraft = null; toast("Nota guardada"); break; }
    case "swapAsk": openSheet({type:"swap", i:Number(ds.i), id:ds.id, from:S.draft.items[ds.i].exerciseId, perm:false}); break;
    case "swapPerm": UI.sheet.perm = !UI.sheet.perm; render(); break;
    case "swapDo": doSwap(); break;
    case "calMove": { const b = UI.calMonth ? pDate(UI.calMonth) : new Date(); b.setDate(1); b.setMonth(b.getMonth() + Number(ds.d)); UI.calMonth = dStr(b); render(); break; }
    case "calDay": UI.calSel = ds.d; render(); break;
    case "registerPast": openSheet({type:"pick", title:`Registrar entrenamiento del ${fmtDate(UI.calSel,{day:"numeric",month:"long"})}`}); break;
    case "pickRoutine": startDraft(S.routines[ds.id], UI.calSel); break;
    case "openSession": go("sessionDetail", {id:ds.id}); break;
    case "delSessionAsk": openSheet({type:"confirm", title:"Eliminar registro", text:"Este entrenamiento desaparece del historial y de las estadísticas. No se puede deshacer.", ok:"delSession", id:ds.id, okLabel:"Eliminar", danger:true}); break;
    case "delSession": del("sessions", ds.id); UI.rutinaSeg = "historial"; go("home", {}, "rutina"); toast("Registro eliminado"); break;
    /* salud */
    case "pfSexo": putSettings({perfil:{...perfil(), sexo:ds.v}}); break;
    case "pRange": UI.pRange = ds.v; render(); break;
    case "metric": UI.metric = ds.k; render(); break;
    case "bodyNew": UI.bForm = {id:null, fecha:today()}; go("bodyForm", {}, "salud"); break;
    case "bodyEdit": UI.bForm = clone(S.body[ds.id]); go("bodyForm", {}, "salud"); break;
    case "bodySave": { const b = UI.bForm; if (!b.fecha){ toast("Elige la fecha"); break; } const id = b.id || uid(); const body = {fecha:b.fecha, creado:b.creado || Date.now(), nota:b.nota||""}; BODY.forEach(f => { body[f.k] = b[f.k] ?? null; }); put("body", id, body); UI.bForm = null; go("home", {}, "salud"); toast("Registro guardado"); break; }
    case "bodyDelAsk": openSheet({type:"confirm", title:"Eliminar registro", text:"Se borra esta medición. No se puede deshacer.", ok:"bodyDel", okLabel:"Eliminar", danger:true}); break;
    case "bodyDel": del("body", UI.bForm.id); UI.bForm = null; go("home", {}, "salud"); break;
    /* configuración */
    case "unit": putSettings({unidadOficial:ds.v}); UI.wunits = {}; break;
    case "theme": putSettings({tema:ds.v}); break;
    case "export": exportData(); break;
    case "copyExport": { const t = document.getElementById("exp-txt"); const txt = t.value; if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast("Copiado")).catch(() => { t.select(); }); else t.select(); break; }
    case "doImport": doImport(); break;
    case "editRoutine": { const r = clone(S.routines[ds.id]); r.items = r.items || []; UI.rForm = r; go("routineEdit", {}, "config"); break; }
    case "moveRoutine": { const rs = activeRoutines(), i = rs.findIndex(r => r.id === ds.id), j = i + Number(ds.d); if (j < 0 || j >= rs.length) break;
      rs.forEach((r,k) => r._o = k); [rs[i]._o, rs[j]._o] = [rs[j]._o, rs[i]._o];
      rs.forEach(r => { if ((r.orden ?? -1) !== r._o){ const b = clone(r); delete b.id; delete b._o; b.orden = r._o; put("routines", r.id, b); } delete r._o; }); break; }
    case "rDay": { const d = Number(ds.d), a = UI.rForm.dias = UI.rForm.dias || [], k = a.indexOf(d); k >= 0 ? a.splice(k,1) : a.push(d); render(); break; }
    case "rItemAdd": UI.rForm.items.push({exerciseId:"", series:3, repMin:12, repMax:15, cargaKg:null}); render(); break;
    case "rItemDel": UI.rForm.items.splice(Number(ds.i), 1); render(); break;
    case "rItemMove": { const it = UI.rForm.items, i = Number(ds.i), j = i + Number(ds.d); if (j < 0 || j >= it.length) break; [it[i], it[j]] = [it[j], it[i]]; render(); break; }
    case "saveRoutine": saveRoutine(); break;
    case "dupRoutine": { const r = clone(UI.rForm); r.id = uid(); r.nombre = r.nombre + " (copia)"; delete r.archivada; delete r.orden; UI.rForm = r; toast("Copia lista: ajústala y guarda"); render(true); break; }
    case "archRoutine": { const r = S.routines[UI.rForm.id]; const b = clone(r); delete b.id; b.archivada = !r.archivada; put("routines", r.id, b); toast(b.archivada ? "Rutina archivada" : "Rutina restaurada"); go("routines"); break; }
    case "delRoutineAsk": openSheet({type:"confirm", title:"Eliminar rutina", text:"Los entrenamientos ya registrados con esta rutina se conservan en el historial.", ok:"delRoutine", okLabel:"Eliminar rutina", danger:true}); break;
    case "delRoutine": del("routines", UI.rForm.id); UI.rForm = null; go("routines"); break;
    case "newExercise": UI.xForm = {id:uid(), nombre:"", emoji:"🏋️", tipo:"fuerza", musculos:[], alternativas:[], nota:""}; go("exerciseEdit", {}, "config"); break;
    case "editExercise": { const x = clone(S.exercises[ds.id]); x.imagenes = x.imagenes || []; x.musculos = x.musculos || []; x.alternativas = x.alternativas || []; UI.xForm = x; go("exerciseEdit", {}, "config"); break; }
    case "xBack": { const from = UI.xForm && UI.xForm._from; UI.xForm = null; if (from === "routineEdit"){ const r = UI.rForm; if (r) r.items.forEach(it => { if (it.exerciseId === "__new") it.exerciseId = ""; }); go("routineEdit", {}, "config"); } else go("library"); break; }
    case "xImgClear": UI.xForm.imagenes = []; UI.xForm.fuenteImg = ""; render(); break;
    case "xTipo": UI.xForm.tipo = ds.v; render(); break;
    case "xMuscle": { const m = UI.xForm.musculos, k = m.indexOf(ds.m); k >= 0 ? m.splice(k,1) : m.push(ds.m); render(); break; }
    case "xAlt": { const m = UI.xForm.alternativas, k = m.indexOf(ds.id); k >= 0 ? m.splice(k,1) : m.push(ds.id); render(); break; }
    case "saveExercise": saveExercise(); break;
    case "delExerciseAsk": { if (!(S.mode === "local" || S.me.owner)) break; const used = Object.values(S.routines).filter(r => (r.items||[]).some(it => it.exerciseId === UI.xForm.id)); if (used.length){ toast(`Está en ${used.length} rutina${used.length===1?"":"s"} (${used.map(r => r.nombre).join(", ")}). Quítalo de ahí primero.`); break; } openSheet({type:"confirm", title:"Eliminar ejercicio", text:"El historial conserva su nombre en los entrenamientos pasados.", ok:"delExercise", okLabel:"Eliminar", danger:true}); break; }
    case "delExercise": { if (!(S.mode === "local" || S.me.owner)) break; const id = UI.xForm.id; del("exercises", id); Object.values(S.exercises).forEach(o => { if ((o.alternativas||[]).includes(id)){ const b = clone(o); delete b.id; b.alternativas = b.alternativas.filter(a => a !== id); put("exercises", o.id, b); } }); UI.xForm = null; go("library"); break; }
  }
});

const tipEl = document.getElementById("tip");
function showTip(el, x, y){ const t = el.getAttribute("data-tip"); if (!t) return; tipEl.textContent = t; tipEl.hidden = false; const w = tipEl.offsetWidth, hgt = tipEl.offsetHeight; tipEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w/2)) + "px"; tipEl.style.top = Math.max(8, y - hgt - 12) + "px"; }
document.addEventListener("pointermove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else tipEl.hidden = true; });
document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el){ const r = el.getBoundingClientRect(); showTip(el, r.left + r.width/2, r.top); } else tipEl.hidden = true; });
document.addEventListener("scroll", () => { tipEl.hidden = true; }, {passive:true});
initData();
})();
</script>
